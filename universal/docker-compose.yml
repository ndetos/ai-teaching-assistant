services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  ai-tutor:
    image: ndetos/ai-tutor-sim:latest
    container_name: ai-tutor
    ports:
      - "5004:5004"
    environment:
      - OLLAMA_HOST=ollama
      - STUDENT_URL=${STUDENT_URL:-http://localhost:5004}
    volumes:
      # IMPORTANT: Mount the customized Python file
      - /home/wandeto/ai-tutor/ndetos_sim.py:/app/ndetos_sim.py
      # IMPORTANT: Mount the generated knowledge base
      - /home/wandeto/ai-tutor/knowledge_base.pkl:/app/knowledge/knowledge_base.pkl
      # Course materials (read-only is fine for production)
      - /home/wandeto/ai-tutor/course-materials:/app/course_materials:ro
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
